<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<style>html,body {margin:0;background:transparent} canvas {display:block}</style>
<canvas id="canvas"></canvas>
<script>
window.ready = false;
window.requestAnimationFrame = () => 0; // fixed stepping only; no wall-clock loop
window.mathTrace=[];
window.enableMathTrace=false;
if(window.enableMathTrace) for(const name of ['sqrt','sin','cos','atan2']) {
    const fn=Math[name];
    Math[name]=function(...args) {
        const result=fn(...args);
        if(window.traceMath && window.mathTrace.length<2000)
            window.mathTrace.push({name,args,result,stack:new Error().stack});
        return result;
    };
}
var Module = {onRuntimeInitialized() { window.ready = true; }};
</script>
<script src="/trace.js"></script>
<script src="/driver/FreeMoteDriver.js"></script>
<script src="/driver/emoteplayer.js"></script>
<script>
window.capture = async function(options) {
    const canvas = document.getElementById('canvas');
    canvas.width = options.width; canvas.height = options.height;
    EmotePlayer.setRenderCanvas(canvas);
    const player = new EmotePlayer(canvas);
    player.loadData(new Uint8Array(await (await fetch('/model.psb')).arrayBuffer()));
    const device = EmotePlayer.device;
    const gl = device.gl;
    const id = player.playerId;
    EmotePlayer_SetHairScale(id, 0);
    EmotePlayer_SetPartsScale(id, 0);
    EmotePlayer_SetBustScale(id, 0);
    EmotePlayer_StopWind(id);
    EmotePlayer_SetCoord(id, options.x, options.y, 0, 0);
    EmotePlayer_SetScale(id, options.scale, 0, 0);
    const variables = {};
    for (let i=0; i<EmotePlayer_CountVariables(id); ++i) {
        const label=EmotePlayer_GetVariableLabelAt(id,i);
        variables[label]=EmotePlayer_GetVariable(id,label);
    }
    for(const label of options.observeVariables||[]) variables[label]=EmotePlayer_GetVariable(id,label);
    window.traceMath=options.traceMath;
    for (const [label,value] of Object.entries(options.variables))
        EmotePlayer_SetVariable(id,label,value,0,0);
    for(const [label,request] of Object.entries(options.transitions||{}))
        EmotePlayer_SetVariable(id,label,request.value,request.frames,request.easing);
    EmoteDevice_SetMaskMode(1);
    EmoteDevice_SetProtectTranslucentTextureColor(true);
    EmoteDevice_SetMaskRegionClipping(true);
    // Draw through the original player's render texture and original WebGL
    // composition path. speed=0 prevents any dependence on elapsed real time.
    player._coord=[options.x,options.y]; player._scale=options.scale;
    EmotePlayer_SetVariable(id,"_globalA",255*options.opacity,0,0);
    player._globalA=255*options.opacity;
    player._speed=0; player._stepUpdate=false;
    player._hairScale=player._partsScale=player._bustScale=0;
    const timelineInfo=[];
    for (const [count,label,diff] of [
        [EmotePlayer_CountMainTimelines,EmotePlayer_GetMainTimelineLabelAt,false],
        [EmotePlayer_CountDiffTimelines,EmotePlayer_GetDiffTimelineLabelAt,true]]) {
        for(let i=0;i<count(id);i++) {
            const name=label(id,i);
            timelineInfo.push({label:name,diff,reportedLoop:EmotePlayer_IsLoopTimeline(id,name),
                              reportedFrames:EmotePlayer_GetTimelineTotalFrameCount(id,name)});
        }
    }
    const samples=[];
    const observeVariables=step=>{
        const values={};
        for(const name of Object.keys(variables)) values[name]=EmotePlayer_GetVariable(id,name);
        samples.push({step,frame:step*options.stepFrames,values,
                      playing:(options.timelines||[]).map(name=>EmotePlayer_IsTimelinePlaying(id,name))});
    };
    for(const name of options.timelines||[]) {
        if(!timelineInfo.some(t=>t.label===name)) throw new Error('unknown timeline: '+name);
        EmotePlayer_PlayTimeline(id,name,options.timelineFlags||0);
    }
    if(options.sampleVariables) observeVariables(0);
    for (let i=0;i<options.steps;++i) {
        EmotePlayer_Update(id,options.stepFrames);
        if(options.sampleVariables) observeVariables(i+1);
    }
    device.animating=true;
    device.lastAnimationTime=0;
    window.traceEnabled=options.trace;
    window.traceMaskPixels=options.traceMaskPixels;
    window.isolateRect=options.isolateRect;
    device.drawAnimation(0);
    window.traceEnabled=false;
    window.traceMath=false;
    const pixels=new Uint8Array(canvas.width*canvas.height*4);
    gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
    let visiblePixels=0;
    for(let p=3;p<pixels.length;p+=4) if(pixels[p]) visiblePixels++;
    if(!visiblePixels) throw new Error("reference produced an empty image");
    const observedVariables={};
    for(const label of Object.keys(variables))
        observedVariables[label]=EmotePlayer_GetVariable(id,label);
    const renderer=gl.getExtension('WEBGL_debug_renderer_info');
    const metadata={defaults:variables, observedVariables, timelineInfo, variableSamples:samples,
        mathTrace:window.mathTrace, width:canvas.width,height:canvas.height,
        renderer:renderer?gl.getParameter(renderer.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),
        version:gl.getParameter(gl.VERSION),glError:gl.getError(),visiblePixels};
    return {png:canvas.toDataURL('image/png'),metadata,trace:window.drawTrace,stateTrace:window.stateTrace,maskPixels:window.maskPixels};
};
</script>
