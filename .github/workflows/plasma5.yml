name: KDE Plasma 5 plugin

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-plasma5-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read runner account
        id: account
        run: |
          {
            echo "uid=$(id -u)"
            echo "gid=$(id -g)"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.11.1
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build or restore baseline toolchain image
        # docker/build-push-action v6.18.0
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 14
        with:
          context: tools
          file: tools/ci_almalinux8.Containerfile
          target: plasma5
          tags: nekomote-plasma5
          load: true
          build-args: |
            CI_UID=${{ steps.account.outputs.uid }}
            CI_GID=${{ steps.account.outputs.gid }}
          cache-from: type=gha,version=2,scope=nekomote-plasma5-${{ matrix.arch }}
          # Only trusted default-branch runs seed the shared toolchain cache.
          cache-to: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
                && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
                && format('type=gha,version=2,scope=nekomote-plasma5-{0},mode=min,ignore-error=true,timeout=3m', matrix.arch)
                || '' }}
      - name: Release build, tests and dependency audit
        run: |
          mkdir -p build/ci-plasma5
          PACKAGE_VERSION=0.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then PACKAGE_VERSION="${GITHUB_REF_NAME#v}"; fi
          docker run --rm -e NEKOMOTE_PACKAGE_VERSION="$PACKAGE_VERSION" --user "$(id -u):$(id -g)" \
            -v "$PWD:/source:ro" -v "$PWD/build/ci-plasma5:/output:rw" \
            nekomote-plasma5 plasma5 2>&1 | tee build/ci-plasma5/build-test.log
          test -s build/ci-plasma5/tests.xml
          test -s build/ci-plasma5/compatibility.json
          test -s build/ci-plasma5/nekomote-plasma5-${{ matrix.arch }}.tar.gz
      - name: Upload release package
        # actions/upload-artifact v4.6.2; publication belongs to release.yml.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nekomote-plasma5-${{ matrix.arch }}
          path: |
            build/ci-plasma5/*.tar.gz
            build/ci-plasma5/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload tests and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-plasma5-${{ matrix.arch }}
          path: |
            build/ci-plasma5/*.log
            build/ci-plasma5/*.xml
            build/ci-plasma5/*.json
            build/ci-plasma5/*.txt
          if-no-files-found: warn
          retention-days: 14
