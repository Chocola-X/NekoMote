name: GNOME Shell 45+ Ubuntu 22 baseline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-gnome45-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build baseline toolchain image
        run: |
          mkdir -p build/ci-gnome45
          docker build --build-arg "CI_UID=$(id -u)" --build-arg "CI_GID=$(id -g)" \
            -f tools/ci_ubuntu22.Containerfile -t nekomote-gnome45 tools \
            2>&1 | tee build/ci-gnome45/toolchain-build.log
      - name: Release build, tests and dependency audit
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/source:ro" -v "$PWD/build/ci-gnome45:/output:rw" \
            nekomote-gnome45 gnome45 2>&1 | tee build/ci-gnome45/build-test.log
          test -s build/ci-gnome45/tests.xml
          test -s build/ci-gnome45/compatibility.json
          test -s build/ci-gnome45/nekomote-gnome45-ubuntu22-${{ matrix.arch }}.tar.gz
      - name: Upload release package
        # actions/upload-artifact v4.6.2; publication belongs to release.yml.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nekomote-gnome45-ubuntu22-${{ matrix.arch }}
          path: |
            build/ci-gnome45/*.tar.gz
            build/ci-gnome45/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload tests and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-gnome45-${{ matrix.arch }}
          path: |
            build/ci-gnome45/*.log
            build/ci-gnome45/*.xml
            build/ci-gnome45/*.json
            build/ci-gnome45/*.txt
          if-no-files-found: warn
          retention-days: 14
