name: KDE Plasma 6 baseline plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build baseline toolchain image
        run: |
          mkdir -p build/ci-plasma6
          docker build -f tools/plasma_baseline.Containerfile -t nekomote-plasma6 tools \
            2>&1 | tee build/ci-plasma6/toolchain-build.log
      - name: Release build, tests and dependency audit
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/source:ro" -v "$PWD/build/ci-plasma6:/output:rw" \
            nekomote-plasma6 plasma6 2>&1 | tee build/ci-plasma6/build-test.log
          test -s build/ci-plasma6/tests.xml
          test -s build/ci-plasma6/compatibility.json
          test -s build/ci-plasma6/nekomote-plasma6-${{ matrix.arch }}.tar.gz
      - name: Upload release package
        # actions/upload-artifact v4.6.2; no GitHub release is published.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nekomote-plasma6-${{ matrix.arch }}
          path: |
            build/ci-plasma6/*.tar.gz
            build/ci-plasma6/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload tests and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-plasma6-${{ matrix.arch }}
          path: |
            build/ci-plasma6/*.log
            build/ci-plasma6/*.xml
            build/ci-plasma6/*.json
            build/ci-plasma6/*.txt
          if-no-files-found: warn
          retention-days: 14
